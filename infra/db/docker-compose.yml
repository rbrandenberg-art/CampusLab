services:
  campuslab-oracle:
    image: gvenzl/oracle-free:23-slim
    container_name: campuslab-oracle
    shm_size: '1.5gb'
    ports:
      - "1521:1521"
    environment:
      - ORACLE_PASSWORD=campuslab-admin
      - APP_USER=campuslab
      - APP_USER_PASSWORD=campuslab
    volumes:
      # Monta el script local en la carpeta de inicialización del contenedor
      - ./init.sql:/container-entrypoint-initdb.d/init.sql