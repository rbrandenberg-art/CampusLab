name: campuslab-kafka

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: campuslab-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - campuslab-net

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: campuslab-kafka-broker
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: campuslab-zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://campuslab-kafka-broker:9092,PLAINTEXT_HOST://10.0.12.147:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "9092:29092"
    volumes:
      - campuslab-kafka-data:/var/lib/kafka/data
    networks:
      - campuslab-net

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: campuslab-kafka-ui
    depends_on:
      - kafka
    environment:
      KAFKA_CLUSTERS_0_NAME: campuslab
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: campuslab-kafka-broker:9092
    ports:
      - "8090:8080"
    networks:
      - campuslab-net

volumes:
  campuslab-kafka-data:
    name: campuslab-kafka-data

networks:
  campuslab-net:
    external: true
